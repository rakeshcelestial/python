<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Table Builder</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #333;
      color: white;
    }

    .even {
      background-color: #f9f9f9;
    }

    .odd {
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <h2>Dynamic Table Builder</h2>

  <div id="app"></div>

  <script>
    function buildTable(containerId, data, columns) {
      const container = document.getElementById(containerId);
      if (!container) return;

      container.textContent = "";

      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const tbody = document.createElement("tbody");

      // Create header
      const headerRow = document.createElement("tr");

      columns.forEach(col => {
        const th = document.createElement("th");
        th.textContent = col.label;
        headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);

      // Create body using DocumentFragment
      const fragment = document.createDocumentFragment();

      data.forEach((item, index) => {
        const tr = document.createElement("tr");

        // Zebra striping
        tr.classList.add(index % 2 === 0 ? "even" : "odd");

        // Store index
        tr.dataset.index = index;

        columns.forEach(col => {
          const td = document.createElement("td");

          let value = item[col.key];

          if (typeof col.format === "function") {
            value = col.format(value);
          }

          td.textContent = value;
          tr.appendChild(td);
        });

        fragment.appendChild(tr);
      });

      tbody.appendChild(fragment);

      table.appendChild(thead);
      table.appendChild(tbody);

      container.appendChild(table);
    }

    // Sample Data
    const users = [
      { name: "Alice", age: 25, role: "Developer" },
      { name: "Bob", age: 30, role: "Designer" },
      { name: "Carol", age: 28, role: "Manager" }
    ];

    const columns = [
      { key: "name", label: "Full Name" },
      { key: "age", label: "Age", format: (val) => val + " years" },
      { key: "role", label: "Position" }
    ];

    // Call function
    buildTable("app", users, columns);
  </script>

</body>
</html>
