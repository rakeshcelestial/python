<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cookie Manager & Session Tracker</title>

  <style>
    body { font-family: Arial; padding: 20px; }
    button { margin: 5px; }
    #output { margin-top: 20px; background: #f4f4f4; padding: 10px; }
  </style>
</head>
<body>

<h2>Cookie Manager & Session Tracker</h2>

<button onclick="setTheme()">Set Theme (dark)</button>
<button onclick="getTheme()">Get Theme</button>
<button onclick="deleteTheme()">Delete Theme</button>
<button onclick="showAll()">Show All Cookies</button>

<div id="output"></div>

<script>
// -------- COOKIE MANAGER --------
const CookieManager = {
  set(name, value, options = {}) {
    let cookie = `${encodeURIComponent(name)}=${encodeURIComponent(value)}`;

    if (options.expires) {
      const date = new Date();
      date.setTime(date.getTime() + options.expires * 86400000);
      cookie += `; expires=${date.toUTCString()}`;
    }

    if (options.path) cookie += `; path=${options.path}`;
    if (options.secure) cookie += `; secure`;
    if (options.sameSite) cookie += `; samesite=${options.sameSite}`;

    document.cookie = cookie;
  },

  get(name) {
    const cookies = document.cookie.split("; ");
    for (let c of cookies) {
      const [key, ...rest] = c.split("=");
      if (decodeURIComponent(key) === name) {
        return decodeURIComponent(rest.join("=")); // handles "=" in value
      }
    }
    return null;
  },

  getAll() {
    const obj = {};
    document.cookie.split("; ").forEach(c => {
      const [key, ...rest] = c.split("=");
      obj[decodeURIComponent(key)] = decodeURIComponent(rest.join("="));
    });
    return obj;
  },

  has(name) {
    return this.get(name) !== null;
  },

  delete(name) {
    document.cookie = `${encodeURIComponent(name)}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/`;
  }
};

// -------- SESSION TRACKER --------
function updateSession() {
  const visits = parseInt(CookieManager.get("visits") || "0") + 1;
  const now = new Date().toISOString();

  if (!CookieManager.has("firstVisit")) {
    CookieManager.set("firstVisit", now, { expires: 30, path: "/" });
  }

  CookieManager.set("visits", visits, { expires: 30, path: "/" });
  CookieManager.set("lastVisit", now, { expires: 30, path: "/" });

  displaySession();
}

function displaySession() {
  const visits = CookieManager.get("visits");
  const first = new Date(CookieManager.get("firstVisit")).toLocaleString();
  const last = new Date(CookieManager.get("lastVisit")).toLocaleString();

  document.getElementById("output").innerHTML =
    `Visit #${visits}<br>First: ${first}<br>Last: ${last}`;
}

// -------- UI ACTIONS --------
function setTheme() {
  CookieManager.set("theme", "dark", { expires: 30, path: "/" });
  alert("Theme set");
}

function getTheme() {
  alert("Theme: " + CookieManager.get("theme"));
}

function deleteTheme() {
  CookieManager.delete("theme");
  alert("Theme deleted");
}

function showAll() {
  document.getElementById("output").textContent =
    JSON.stringify(CookieManager.getAll(), null, 2);
}

// -------- INIT --------
updateSession();
</script>

</body>
</html>
