<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debounced Live Search</title>

  <style>
    body { font-family: Arial; padding: 20px; }
    input { padding: 10px; width: 300px; }

    .dropdown {
      border: 1px solid #ccc;
      width: 300px;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 5px;
    }

    .item {
      padding: 8px;
      border-bottom: 1px solid #eee;
    }

    .highlight {
      background: yellow;
      font-weight: bold;
    }

    .loading { color: blue; padding: 8px; }
    .empty { color: red; padding: 8px; }
  </style>
</head>
<body>

<h2>Live Search (Debounce + Abort)</h2>

<input id="search" placeholder="Search users..." />
<div id="dropdown" class="dropdown"></div>

<script>
const input = document.getElementById("search");
const dropdown = document.getElementById("dropdown");

let controller = null;

// -------- DEBOUNCE --------
function debounce(fn, delay) {
  let timer;
  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), delay);
  };
}

// -------- HIGHLIGHT --------
function highlight(text, query) {
  const regex = new RegExp(`(${query})`, "gi");
  return text.replace(regex, '<span class="highlight">$1</span>');
}

// -------- FETCH USERS --------
async function searchUsers(query) {
  if (query.length < 2) {
    dropdown.innerHTML = "";
    return;
  }

  // Cancel previous request
  if (controller) controller.abort();
  controller = new AbortController();

  dropdown.innerHTML = '<div class="loading">Loading...</div>';

  try {
    const res = await fetch(
      `https://jsonplaceholder.typicode.com/users`,
      { signal: controller.signal }
    );

    if (!res.ok) throw new Error("Error fetching");

    const users = await res.json();

    // Filter manually (API doesn't support ?q)
    const filtered = users.filter(u =>
      u.name.toLowerCase().includes(query.toLowerCase())
    );

    if (filtered.length === 0) {
      dropdown.innerHTML = '<div class="empty">No results</div>';
      return;
    }

    dropdown.innerHTML = "";

    filtered.forEach(user => {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = highlight(user.name, query);
      dropdown.appendChild(div);
    });

  } catch (err) {
    if (err.name === "AbortError") return;
    dropdown.innerHTML = '<div class="empty">Error loading</div>';
  }
}

// -------- EVENT --------
const debouncedSearch = debounce(searchUsers, 300);

input.addEventListener("input", (e) => {
  const value = e.target.value.trim();

  if (!value) {
    dropdown.innerHTML = "";
    return;
  }

  debouncedSearch(value);
});
</script>

</body>
</html>
