<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Playground</title>
    <link rel="stylesheet" href="pos.css">
</head>
<body>

<!-- Sticky Navigation -->
<header class="navbar">
    <h1>My Store</h1>
</header>

<main>

    <!-- Product Card with Sale Badge -->
    <section class="section">
        <h2>Product Card</h2>

        <article class="card">
            <span class="badge">SALE</span>
            <img src="https://via.placeholder.com/300" alt="Product image">
            <p>Awesome Product</p>
        </article>
    </section>

    <!-- Tooltip Section -->
    <section class="section">
        <h2>Tooltip Example</h2>

        <div class="tooltip-container">
            <span class="info-icon">ℹ️</span>
            <span class="tooltip">This is additional information</span>
        </div>
    </section>

    <!-- Scroll Content -->
    <section class="section long-content">
        <h2>Scrollable Content</h2>
        <p>Scroll down to see sticky header and fixed button in action.</p>
        <p>More content...</p>
        <p>More content...</p>
        <p>More content...</p>
        <p>More content...</p>
        <p>More content...</p>
        <p>More content...</p>
    </section>

</main>

<!-- Fixed Button -->
<a href="#" class="back-to-top">↑ Top</a>

</body>
</html>
