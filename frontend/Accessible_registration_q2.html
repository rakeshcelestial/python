<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: auto;
            padding: 20px;
            line-height: 1.5;
        }

        h1 {
            text-align: center;
        }

        fieldset {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        legend {
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        /* Inline inputs (radio/checkbox) */
        .inline-group input {
            width: auto;
            margin-right: 5px;
        }

        .inline-group label {
            display: inline;
            margin-right: 15px;
        }

        /* Validation styles */
        input:invalid, textarea:invalid {
            border-color: red;
        }

        input:valid, textarea:valid {
            border-color: green;
        }

        input:focus, textarea:focus {
            outline: 2px solid blue;
        }

        button {
            padding: 10px;
            width: 100%;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: darkblue;
        }
    </style>
</head>
<body>

<main>
    <h1>User Registration</h1>

    <form action="#" method="post" enctype="multipart/form-data">

        <!-- Personal Info -->
        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" required minlength="3">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                required 
                minlength="8"
                pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}"
                title="Must contain uppercase, lowercase, and a number"
            >

            <label for="confirm-password">Confirm Password</label>
            <input 
                type="password" 
                id="confirm-password" 
                name="confirm-password" 
                required 
                minlength="8"
            >

            <label for="dob">Date of Birth</label>
            <input 
                type="date" 
                id="dob" 
                name="dob" 
                required 
                max="2026-03-31"
            >

            <label for="phone">Phone Number</label>
            <input 
                type="tel" 
                id="phone" 
                name="phone" 
                required 
                pattern="[0-9]{10}"
                title="Enter a 10-digit number"
            >

        </fieldset>

        <!-- Gender -->
        <fieldset>
            <legend>Gender</legend>

            <div class="inline-group">
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
            </div>

        </fieldset>

        <!-- Skills -->
        <fieldset>
            <legend>Skills</legend>

            <div class="inline-group">
                <!-- One required ensures at least one selected -->
                <input type="checkbox" id="html" name="skills" value="html" required>
                <label for="html">HTML</label>

                <input type="checkbox" id="css" name="skills" value="css">
                <label for="css">CSS</label>

                <input type="checkbox" id="js" name="skills" value="javascript">
                <label for="js">JavaScript</label>

                <input type="checkbox" id="python" name="skills" value="python">
                <label for="python">Python</label>
            </div>

        </fieldset>

        <!-- Bio -->
        <fieldset>
            <legend>Bio</legend>

            <label for="bio">Tell us about yourself</label>
            <textarea 
                id="bio" 
                name="bio" 
                maxlength="500" 
                rows="4"
                placeholder="Max 500 characters"
            ></textarea>

        </fieldset>

        <!-- Profile Picture -->
        <fieldset>
            <legend>Profile Picture</legend>

            <label for="profile">Upload Image</label>
            <input 
                type="file" 
                id="profile" 
                name="profile" 
                accept=".jpg,.jpeg,.png,.webp"
                required
            >

        </fieldset>

        <!-- Submit -->
        <button type="submit">Register</button>

    </form>
</main>

</body>
</html>
