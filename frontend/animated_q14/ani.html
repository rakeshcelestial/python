<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSS Loading States</title>
  <link rel="stylesheet" href="ani.css"/>
</head>
<body>

<main class="wrapper">
  <h1>CSS Loading States</h1>

  <!-- Spinner -->
  <section class="block">
    <h2>Spinner</h2>
    <div class="spinner"></div>
  </section>

  <!-- Bouncing Dots -->
  <section class="block">
    <h2>Bouncing Dots</h2>
    <div class="dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </section>

  <!-- Skeleton Screen -->
  <section class="block">
    <h2>Skeleton</h2>
    <div class="skeleton-card">
      <div class="sk-image"></div>
      <div class="sk-line"></div>
      <div class="sk-line short"></div>
    </div>
  </section>

  <!-- Progress Bar -->
  <section class="block">
    <h2>Progress Bar</h2>
    <div class="progress">
      <div class="progress-bar"></div>
    </div>
  </section>

</main>

</body>
</html>
