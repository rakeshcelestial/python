<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSS Variables Theme Switcher</title>
  <link rel="stylesheet" href="theme.css"/>
</head>
<body>

<header class="nav">
  <h1>My App</h1>
  <!-- One-line JS toggle -->
  <button class="btn" onclick="document.body.classList.toggle('dark-theme')">
    Toggle Theme
  </button>
</header>

<main class="container">

  <section class="card">
    <h2>Card Title</h2>
    <p>This is a themed card. All styles use CSS variables.</p>
    <button class="btn">Primary Action</button>
  </section>

  <section class="card">
    <h2>Another Card</h2>
    <p class="muted">Secondary text uses muted color variable.</p>
    <button class="btn outline">Secondary Action</button>
  </section>

</main>

<footer class="footer">
  <p>© 2026 My App</p>
</footer>

</body>
</html>
